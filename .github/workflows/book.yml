name: Build Book

on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'bibliography.bib'
      - 'chapters/**'
      - 'shared/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/book.yml'
  pull_request:
    branches: [main]
    paths:
      - 'main.tex'
      - 'bibliography.bib'
      - 'chapters/**'
      - 'shared/**'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/book.yml'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            biber \
            python3-pygments \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-pictures \
            texlive-science

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # minted v3 highlights through the `latexminted` executable. The wheel that
      # TeX Live 2025 bundles (latexminted-0.6.0) fails on the runner's Python 3.14:
      # argparse passes `color=` to a constructor that does not accept it. The PyPI
      # build of the same version accepts it, and setup-python puts it first on PATH.
      - name: Install latexminted from PyPI
        run: |
          python -m pip install "latexminted==0.6.0"
          command -v latexminted
          latexminted --version

      - name: Build book with LuaLaTeX and biber
        run: make

      - name: Report non-blocking box warnings
        if: always()
        run: |
          if [ -f main.log ]; then
            grep -E "Overfull|Underfull" main.log || true
          fi
